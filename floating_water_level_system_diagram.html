<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Floating Water-Level System Diagram</title>
  <style>
    body{font-family:Inter, Arial, Helvetica, sans-serif; background:#f6fbff; padding:18px}
    h1{font-size:20px;margin:6px 0 12px}
    svg{max-width:100%;height:auto;border-radius:8px;background:#fff;box-shadow:0 6px 18px rgba(12,40,80,0.06);}
    .note{font-size:13px;color:#234;margin-top:12px}
    .legend{font-size:13px;margin-top:10px}
    .card{fill:#fff;stroke:#dbeaf5;stroke-width:1.5;rx:8;}
    .title{font-weight:700;font-size:13px;fill:#063a6b}
    .sub{font-size:12px;fill:#234}
    .small{font-size:11px;fill:#456}
    .arrow{stroke:#2b83c2;stroke-width:2;fill:none;marker-end:url(#arrowhead)}
  </style>
</head>
<body>
  <h1>Floating GSM-Based Water-Level Monitoring — System Architecture</h1>

  <!-- SVG Diagram -->
  <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#2b83c2" />
      </marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#123" flood-opacity="0.06" />
      </filter>
    </defs>

    <!-- Left: Floating Node -->
    <g transform="translate(40,40)">
      <rect class="card" x="0" y="0" width="300" height="200"/>
      <text class="title" x="18" y="28">Floating Sensor Node (Buoy)</text>

      <text class="sub" x="18" y="56">Sensors:</text>
      <text class="small" x="36" y="74">• Ultrasonic / Pressure sensor (water level)</text>
      <text class="small" x="36" y="92">• Accelerometer (wave motion) optional</text>
      <text class="small" x="36" y="110">• Temperature / Salinity (optional)</text>

      <text class="sub" x="18" y="138">Electronics:</text>
      <text class="small" x="36" y="156">• MCU (ESP32 / Arduino)</text>
      <text class="small" x="36" y="174">• GSM/GPRS modem (SIM800/900) or NB-IoT</text>

      <rect x="232" y="18" width="48" height="26" rx="6" fill="#daf1ff" stroke="#9ed0ef"/>
      <text class="small" x="240" y="36" fill="#045a8d">Solar + Battery</text>
    </g>

    <!-- Arrow from Buoy to Cellular Gateway -->
    <path class="arrow" d="M340 140 L440 140" />

    <!-- Center: Cellular / Local Gateway -->
    <g transform="translate(460,28)">
      <rect class="card" x="0" y="0" width="220" height="220"/>
      <text class="title" x="14" y="28">Cellular / Local Gateway</text>
      <text class="small" x="14" y="56">• GSM Tower / Local GSM network</text>
      <text class="small" x="14" y="76">• LoRaWAN Gateway (optional)</text>
      <text class="small" x="14" y="96">• Edge Aggregator (Raspberry Pi)</text>

      <text class="sub" x="14" y="128">Functions:</text>
      <text class="small" x="32" y="148">• Aggregates sensor data</text>
      <text class="small" x="32" y="166">• Retries + store-and-forward</text>
      <text class="small" x="32" y="184">• Provide OTA updates bridge</text>
    </g>

    <!-- Arrow to Cloud -->
    <path class="arrow" d="M690 140 L780 140" />

    <!-- Right: Cloud & Dashboard -->
    <g transform="translate(800,34)">
      <rect class="card" x="0" y="0" width="180" height="220"/>
      <text class="title" x="12" y="28">Cloud & Central Server</text>
      <text class="small" x="12" y="56">• REST API / Ingestion</text>
      <text class="small" x="12" y="74">• Time-series DB (InfluxDB / Postgres)</text>
      <text class="small" x="12" y="92">• Object storage (media / logs)</text>

      <text class="sub" x="12" y="126">Dashboard & Alerts:</text>
      <text class="small" x="32" y="146">• Web & Mobile Dashboard (React)</text>
      <text class="small" x="32" y="164">• SMS / Email / Push alerts</text>
      <text class="small" x="32" y="182">• Analytics & Flood Prediction</text>
    </g>

    <!-- Down: Local Logger + Maintenance -->
    <g transform="translate(140,260)">
      <rect class="card" x="0" y="0" width="720" height="120"/>
      <text class="title" x="18" y="28">Resilience & Maintenance</text>
      <text class="small" x="18" y="52">• Local data logging on SD / LittleFS (buffer when GSM fails)</text>
      <text class="small" x="18" y="72">• Solar + Battery + Low-power sleep scheduling</text>
      <text class="small" x="18" y="92">• Vandal-resistant enclosure & mounting; regular maintenance checks</text>
    </g>

    <!-- Arrows from Cloud to Alerts / Users -->
    <path class="arrow" d="M860 260 L860 320" />
    <text class="small" x="840" y="336">Authorities</text>
    <path class="arrow" d="M930 260 L930 320" />
    <text class="small" x="912" y="336">Villagers (SMS)</text>

    <!-- Legend box -->
    <g transform="translate(40,400)">
      <rect x="0" y="0" width="940" height="92" rx="8" fill="#fff" stroke="#e6f2fb"/>
      <text class="title" x="12" y="22">Legend & Notes</text>
      <text class="small" x="12" y="44">• Sampling: hourly by default; configurable to higher frequency during events.</text>
      <text class="small" x="12" y="62">• Emergency alert: threshold-based triggers (rising rate + absolute level).</text>
      <text class="small" x="12" y="80">• Local logging ensures no data loss during network outages.</text>
    </g>
  </svg>

  <div class="note">Open the diagram and use it as a block-level architecture for your report. The SVG is editable if you want to adapt labels or colors.</div>
</body>
</html>
