name: sentinel_sos
description: User-side SOS application for Sentinel Disaster Management System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^1.10.0
  geolocator: ^10.1.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_local_notifications: ^18.0.0
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
